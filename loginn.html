<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Financial Performance Dashboard</title>
    <link rel="stylesheet" href="style.css"> <!-- Hubungkan dengan CSS Anda -->
</head>
<body class="login-body">
    
    <div class="login-container">
        <h2>login</h2>
        <form action="index.html" method="GET"> <!-- Mengarahkan ke dashboard setelah tombol login diklik -->
            <div class="input-group">
                <input type="text" placeholder="username" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="password" required>
            </div>
            <div class="login-options">
                <label><input type="checkbox"> remember me</label>
                <a href="#">forget password</a>
            </div>
            <button type="submit" class="login-btn">login</button>
            <p class="register-link">Don't have an account <a href="#">register</a></p>
        </form>
    </div>

</body>
</html>
