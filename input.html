<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Data Financial - Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b132b; color: #ffffff; min-height: 100vh; padding: 2rem; }
    .admin-container { max-width: 900px; margin: 0 auto; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #1c2541; padding-bottom: 1rem; }
    .card-form { background-color: #1c2541; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .form-row .form-group { flex: 1; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: #e0e1dd; }
    input, select { width: 100%; padding: 0.75rem; border-radius: 4px; border: 1px solid #3a506b; background-color: #0b132b; color: #fff; }
    .divider { border: 0; height: 1px; background: #3a506b; margin: 1.5rem 0; }
    .form-section-title { font-weight: bold; font-size: 1.05rem; color: #6fffe9; margin-bottom: 0.8rem; }
    button { padding: 0.75rem 1.5rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-primary { background-color: #3a86ff; color: white; width: 100%; }
    .btn-secondary { background-color: #4a5568; color: white; text-decoration: none; padding: 0.6rem 1rem; border-radius: 4px; font-size: 0.9rem; }
    .msg-status { margin-top: 1rem; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <h2>Input Data Financial Performance</h2>
      <div>
        <!-- Kembali mengarah ke index_2.html -->
        <a href="index_2.html" class="btn-secondary">Lihat Dashboard</a>
      </div>
    </header>

    <div class="card-form">
      <form id="financial-form">
        <div class="form-row">
          <div class="form-group">
            <label for="monthIndex">Pilih Bulan</label>
            <select id="monthIndex" required>
              <option value="0">Januari</option>
              <option value="1">Februari</option>
              <option value="2">Maret</option>
              <option value="3">April</option>
              <option value="4">Mei</option>
              <option value="5">Juni</option>
              <option value="6">Juli</option>
              <option value="7">Agustus</option>
              <option value="8">September</option>
              <option value="9">Oktober</option>
              <option value="10">November</option>
              <option value="11">Desember</option>
            </select>
          </div>
          <div class="form-group">
            <label for="status">Status Periode</label>
            <select id="status" required>
              <option value="REALISASI">REALISASI</option>
              <option value="PROGNOSA">PROGNOSA</option>
            </select>
          </div>
        </div>

        <hr class="divider">

        <div class="form-section-title">Pendapatan Usaha (Juta Rp)</div>
        <div class="form-row">
          <div class="form-group">
            <label for="revenuePlan">Rencana Pendapatan</label>
            <input type="number" step="any" id="revenuePlan" required>
          </div>
          <div class="form-group">
            <label for="revenueActual">Realisasi / Prognosa Pendapatan</label>
            <input type="number" step="any" id="revenueActual" required>
          </div>
        </div>

        <div class="form-section-title">Beban Pokok Pendapatan (Juta Rp)</div>
        <div class="form-row">
          <div class="form-group">
            <label for="bppPlan">Rencana BPP</label>
            <input type="number" step="any" id="bppPlan" required>
          </div>
          <div class="form-group">
            <label for="bppActual">Realisasi / Prognosa BPP</label>
            <input type="number" step="any" id="bppActual" required>
          </div>
        </div>

        <button type="submit" class="btn-primary">Simpan Perubahan</button>
        <p id="msg-status" class="msg-status"></p>
      </form>
    </div>
  </div>

  <script>
    const monthsList = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    
    const defaultData = {
      revPlan: [554, 554, 449, 380, 502, 879, 927, 1042, 2196, 2196, 2145, 1678],
      revAct:  [823, 787, 99, 782, 688, 1117, 1668, 1703, 1786, 1670, 1393, 1393],
      bppPlan: [195, 195, 195, 165, 308, 495, 531, 613, 1218, 1218, 1198, 1013],
      bppAct:  [647, 632, 92, 680, 404, 913, 1342, 1164, 1340, 1280, 1088, 1088],
      status:  ["REALISASI","REALISASI","REALISASI","REALISASI","REALISASI","REALISASI","REALISASI","REALISASI","REALISASI","PROGNOSA","PROGNOSA","PROGNOSA"]
    };

    function getData() {
      const saved = localStorage.getItem('financial_performance_data');
      if (saved) {
        try { return JSON.parse(saved); } catch(e) {}
      }
      return defaultData;
    }

    const monthSelect = document.getElementById('monthIndex');
    const revenuePlanInput = document.getElementById('revenuePlan');
    const revenueActualInput = document.getElementById('revenueActual');
    const bppPlanInput = document.getElementById('bppPlan');
    const bppActualInput = document.getElementById('bppActual');
    const statusSelect = document.getElementById('status');
    const msgStatus = document.getElementById('msg-status');

    function loadMonthData(idx) {
      const data = getData();
      revenuePlanInput.value = data.revPlan[idx];
      revenueActualInput.value = data.revAct[idx];
      bppPlanInput.value = data.bppPlan[idx];
      bppActualInput.value = data.bppAct[idx];
      statusSelect.value = data.status[idx];
    }

    monthSelect.addEventListener('change', (e) => {
      loadMonthData(parseInt(e.target.value));
    });

    loadMonthData(0);

    document.getElementById('financial-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const idx = parseInt(monthSelect.value);
      const data = getData();

      data.revPlan[idx] = parseFloat(revenuePlanInput.value) || 0;
      data.revAct[idx]  = parseFloat(revenueActualInput.value) || 0;
      data.bppPlan[idx] = parseFloat(bppPlanInput.value) || 0;
      data.bppAct[idx]  = parseFloat(bppActualInput.value) || 0;
      data.status[idx]  = statusSelect.value;

      localStorage.setItem('financial_performance_data', JSON.stringify(data));

      msgStatus.textContent = `Data bulan ${monthsList[idx]} berhasil disimpan!`;
      msgStatus.style.color = '#38b000';

      setTimeout(() => {
        msgStatus.textContent = '';
      }, 3000);
    });
  </script>
</body>
</html>
