<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Data Financial - Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b132b; color: #ffffff; min-height: 100vh; padding: 2rem; }
    .admin-container { max-width: 900px; margin: 0 auto; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #1c2541; padding-bottom: 1rem; }
    .card-form { background-color: #1c2541; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .form-row .form-group { flex: 1; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: #e0e1dd; }
    input, select { width: 100%; padding: 0.75rem; border-radius: 4px; border: 1px solid #3a506b; background-color: #0b132b; color: #fff; }
    .divider { border: 0; height: 1px; background: #3a506b; margin: 1.5rem 0; }
    .form-section-title { font-weight: bold; font-size: 1.05rem; color: #6fffe9; margin-bottom: 0.8rem; }
    .preview-box { background-color: #0b132b; padding: 1rem; border-radius: 6px; margin: 1.5rem 0; border: 1px solid #3a506b; }
    .preview-item { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .preview-item strong { color: #5bc0be; }
    button { padding: 0.75rem 1.5rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-primary { background-color: #3a86ff; color: white; width: 100%; }
    .btn-secondary { background-color: #4a5568; color: white; text-decoration: none; padding: 0.6rem 1rem; border-radius: 4px; font-size: 0.9rem; margin-right: 0.5rem; }
    .btn-danger { background-color: #e63946; color: white; }
    .msg-status { margin-top: 1rem; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <h2>Input Data Financial Performance</h2>
      <div>
        <a href="index.html" class="btn-secondary">Lihat Dashboard</a>
        <button id="btn-logout" class="btn-danger">Logout</button>
      </div>
    </header>

    <div class="card-form">
      <form id="financial-form">
        <div class="form-row">
          <div class="form-group">
            <label for="year">Tahun</label>
            <select id="year" required>
              <option value="2026" selected>2026</option>
              <option value="2027">2027</option>
            </select>
          </div>
          <div class="form-group">
            <label for="month">Bulan</label>
            <select id="month" required>
              <option value="Jan">Januari (Jan)</option>
              <option value="Feb">Februari (Feb)</option>
              <option value="Mar">Maret (Mar)</option>
              <option value="Apr">April (Apr)</option>
              <option value="May">Mei (Mei)</option>
              <option value="Jun">Juni (Jun)</option>
              <option value="Jul">Juli (Jul)</option>
              <option value="Aug">Agustus (Aug)</option>
              <option value="Sep">September (Sep)</option>
              <option value="Oct">Oktober (Oct)</option>
              <option value="Nov">November (Nov)</option>
              <option value="Dec">Desember (Dec)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="status">Status Periode</label>
            <select id="status" required>
              <option value="REALISASI">REALISASI</option>
              <option value="PROGNOSA">PROGNOSA</option>
            </select>
          </div>
        </div>

        <hr class="divider">

        <div class="form-section-title">Pendapatan Usaha (Juta Rp)</div>
        <div class="form-row">
          <div class="form-group">
            <label for="revenuePlan">Rencana Pendapatan</label>
            <input type="number" step="any" id="revenuePlan" placeholder="Contoh: 554" required>
          </div>
          <div class="form-group">
            <label for="revenueActual">Realisasi / Prognosa Pendapatan</label>
            <input type="number" step="any" id="revenueActual" placeholder="Contoh: 823" required>
          </div>
        </div>

        <div class="form-section-title">Beban Pokok Pendapatan (Juta Rp)</div>
        <div class="form-row">
          <div class="form-group">
            <label for="bppPlan">Rencana BPP</label>
            <input type="number" step="any" id="bppPlan" placeholder="Contoh: 195" required>
          </div>
          <div class="form-group">
            <label for="bppActual">Realisasi / Prognosa BPP</label>
            <input type="number" step="any" id="bppActual" placeholder="Contoh: 647" required>
          </div>
        </div>

        <div class="preview-box">
          <div class="preview-item">
            <span>Gross Profit (Rencana):</span>
            <strong id="preview-gp-plan">0</strong>
          </div>
          <div class="preview-item">
            <span>Gross Profit (Realisasi/Prognosa):</span>
            <strong id="preview-gp-actual">0</strong>
          </div>
          <div class="preview-item">
            <span>Gross Profit Margin (Rencana):</span>
            <strong id="preview-gpm-plan">0%</strong>
          </div>
          <div class="preview-item">
            <span>Gross Profit Margin (Realisasi/Prognosa):</span>
            <strong id="preview-gpm-actual">0%</strong>
          </div>
        </div>

        <button type="submit" class="btn-primary">Simpan Ke Firebase</button>
        <p id="msg-status" class="msg-status"></p>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCR0kDRMDjpKfoQq-DRGM-imiU3DlLmoMI",
      authDomain: "financial-perfomance-dashboard.firebaseapp.com",
      projectId: "financial-perfomance-dashboard",
      storageBucket: "financial-perfomance-dashboard.firebasestorage.app",
      messagingSenderId: "136866453174",
      appId: "1:136866453174:web:b69a3e14672eb96cc53817"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Proteksi Halaman Admin
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = 'login.html');
    });

    const form = document.getElementById('financial-form');
    const revenuePlanInput = document.getElementById('revenuePlan');
    const revenueActualInput = document.getElementById('revenueActual');
    const bppPlanInput = document.getElementById('bppPlan');
    const bppActualInput = document.getElementById('bppActual');
    const msgStatus = document.getElementById('msg-status');

    function calculateValues() {
      const revPlan = parseFloat(revenuePlanInput.value) || 0;
      const revActual = parseFloat(revenueActualInput.value) || 0;
      const bppPlan = parseFloat(bppPlanInput.value) || 0;
      const bppActual = parseFloat(bppActualInput.value) || 0;

      const gpPlan = revPlan - bppPlan;
      const gpActual = revActual - bppActual;
      const gpmPlan = revPlan > 0 ? (gpPlan / revPlan * 100) : 0;
      const gpmActual = revActual > 0 ? (gpActual / revActual * 100) : 0;

      document.getElementById('preview-gp-plan').textContent = gpPlan.toLocaleString('id-ID');
      document.getElementById('preview-gp-actual').textContent = gpActual.toLocaleString('id-ID');
      document.getElementById('preview-gpm-plan').textContent = gpmPlan.toFixed(2) + '%';
      document.getElementById('preview-gpm-actual').textContent = gpmActual.toFixed(2) + '%';

      return { gpPlan, gpActual, gpmPlan, gpmActual };
    }

    [revenuePlanInput, revenueActualInput, bppPlanInput, bppActualInput].forEach(input => {
      input.addEventListener('input', calculateValues);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgStatus.textContent = 'Menyimpan data...';
      msgStatus.style.color = '#3a86ff';

      const year = document.getElementById('year').value;
      const month = document.getElementById('month').value;
      const status = document.getElementById('status').value;

      const revPlan = parseFloat(revenuePlanInput.value) || 0;
      const revActual = parseFloat(revenueActualInput.value) || 0;
      const bppPlan = parseFloat(bppPlanInput.value) || 0;
      const bppActual = parseFloat(bppActualInput.value) || 0;
      const { gpPlan, gpActual, gpmPlan, gpmActual } = calculateValues();

      try {
        const docRef = doc(db, 'financial_data', year, 'months', month);
        await setDoc(docRef, {
          month, year: parseInt(year), status,
          revenuePlan: revPlan, revenueActual: revActual,
          bppPlan, bppActual,
          grossProfitPlan: gpPlan, grossProfitActual: gpActual,
          grossProfitMarginPlan: gpmPlan, grossProfitMarginActual: gpmActual,
          updatedAt: new Date()
        });

        msgStatus.textContent = `Data bulan ${month} ${year} berhasil disimpan!`;
        msgStatus.style.color = '#38b000';
      } catch (error) {
        msgStatus.textContent = 'Gagal menyimpan: ' + error.message;
        msgStatus.style.color = '#ff4d4d';
      }
    });
  </script>
</body>
</html>
