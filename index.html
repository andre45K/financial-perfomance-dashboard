            color: #666;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #0056b3;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <h2>Login Dashboard</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Masukkan email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Masukkan password">
            </div>
            <button type="submit" class="btn-login">Masuk</button>
            <div id="errorMessage" class="error-message"></div>
        </form>
    </div>

    <!-- Firebase SDK (Compat version untuk kemudahan integrasi script lama) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script>
        // Konfigurasi Firebase Anda (Sesuaikan jika diperlukan)
        const firebaseConfig = {
            apiKey: "AIzaSyD-PlaceholderKeyForConfig12345",
            authDomain: "financial-performance-dashboard.firebaseapp.com",
            projectId: "financial-performance-dashboard",
            storageBucket: "financial-performance-dashboard.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        // Inisialisasi Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const targetUID = "XusRSMAvbVRCDnkiczxlnKHjuy83";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = "";

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    if (user.uid === targetUID) {
                        // Berhasil login dan UID cocok
                        alert("Login berhasil!");
                        // Arahkan ke halaman dashboard atau muat konten dashboard di sini
                        window.location.href = "dashboard.html"; // Ubah sesuai halaman tujuan jika ada
                    } else {
                        errorElement.textContent = "Akses ditolak: UID akun tidak cocok.";
                        firebase.auth().signOut();
                    }
                })
                .catch((error) => {
                    errorElement.textContent = "Login gagal: " + error.message;
                });
        });
    </script>
</body>
</html>
