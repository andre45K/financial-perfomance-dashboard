            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 450px;
            padding: 40px;
            background: rgba(20, 25, 30, 0.85); /* Efek kaca gelap transparan */
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: #ffffff;
        }

        .login-container h2 {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 30px;
            text-transform: lowercase;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: #b0b0b0;
        }

        .input-group input:focus {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 25px;
            color: #d0d0d0;
            padding: 0 5px;
        }

        .login-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .login-options a {
            color: #d0d0d0;
            text-decoration: none;
        }

        .login-options a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            border: none;
            border-radius: 30px;
            color: #1a1a1a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: lowercase;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            background: #e0e0e0;
        }

        .register-link {
            font-size: 14px;
            color: #d0d0d0;
        }

        .register-link a {
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="login-body">
    
    <div class="login-container">
        <h2>login</h2>
        <form action="dashboard.html" method="GET"> <!-- Mengarahkan ke file dashboard Anda setelah login -->
            <div class="input-group">
                <input type="text" placeholder="username" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="password" required>
            </div>
            <div class="login-options">
                <label><input type="checkbox"> remember me</label>
                <a href="#">forget password</a>
            </div>
            <button type="submit" class="login-btn">login</button>
            <p class="register-link">Don't have an account <a href="#">register</a></p>
        </form>
