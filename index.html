            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

        .login-header h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background: #007bff;
            border: none;
            border-radius: 5px;
            color: #white;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0056b3;
        }

        .error-message {
            color: red;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <h2>Financial Performance Login</h2>
        </div>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Masukkan email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Masukkan password">
            </div>
            <div class="input-group">
                <label for="uid">UID</label>
                <input type="text" id="uid" required placeholder="Masukkan UID">
            </div>
            <button type="submit" class="login-btn">Login</button>
            <div id="errorMessage" class="error-message"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const uid = document.getElementById('uid').value.trim();
            const errorMessage = document.getElementById('errorMessage');

            // Kredensial yang ditentukan
            const validEmail = "andre45krisnadi@gmail.com";
            const validPassword = "123456";
            const validUID = "XYzt5Ig4F7cyn2T0H3cb6w80i8o2";

            if (email === validEmail && password === validPassword && uid === validUID) {
                // Simpan status login atau arahkan ke halaman dashboard
                alert("Login Berhasil!");
                // Contoh pengalihan (opsional, sesuaikan jika ada halaman dashboard):
                // window.location.href = "dashboard.html";
            } else {
                errorMessage.textContent = "Email, Password, atau UID salah!";
            }
        });
    </script>
</body>
</html>
