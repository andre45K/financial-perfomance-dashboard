    <div class="login-container">

    <!-- Firebase Authentication: memakai akun Email/Password yang sudah ada di Firebase Console -->
    <script type="module">

         */
        const firebaseConfig = {
            apiKey: "AIzaSyCR0kDRMDjpKfoQq-DRGM-imiU3DlLmoMI",
            authDomain: "financial-perfomance-dashboard.firebaseapp.com",
            projectId: "financial-perfomance-dashboard",
            appId: "1:136866453174:web:b69a3e14672eb96cc53817"
        };

        const form = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const rememberMe = document.getElementById("rememberMe");
        const message = document.getElementById("loginMessage");
        const loginButton = document.getElementById("loginButton");
        const forgotPassword = document.getElementById("forgotPassword");

        function showMessage(text, isError = true) {
            message.textContent = text;
            message.style.color = isError ? "#ffd7d7" : "#c9f7d4";
        }

        const configIncomplete =
            !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("GANTI_") ||
            !firebaseConfig.projectId || firebaseConfig.projectId.startsWith("GANTI_") ||

        if (configIncomplete) {

                form.addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const email = emailInput.value.trim();
                    const password = passwordInput.value;

                    if (!email || !password) {
                        showMessage("Email dan password wajib diisi.");
                        return;
                    }

                    loginButton.disabled = true;
                    loginButton.textContent = "memproses...";
                    showMessage("", false);

                    try {
                        await setPersistence(
                            auth,
                            rememberMe.checked ? browserLocalPersistence : browserSessionPersistence
                        );
                        await signInWithEmailAndPassword(auth, email, password);
                        showMessage("Login berhasil. Membuka dashboard...", false);
                        window.location.assign(new URL("dashboard.html", window.location.href).href);
                    } catch (error) {
                        const messages = {
                            "auth/invalid-credential": "Email atau password salah.",
                            "auth/invalid-login-credentials": "Email atau password salah.",
                            "auth/user-not-found": "Email belum terdaftar di Firebase Authentication.",
                            "auth/wrong-password": "Password salah.",
                            "auth/invalid-email": "Format email tidak valid.",
                            "auth/too-many-requests": "Terlalu banyak percobaan. Coba lagi nanti.",
                            "auth/network-request-failed": "Koneksi internet bermasalah. Periksa jaringan Anda.",
                            "auth/operation-not-allowed": "Provider Email/Password belum diaktifkan di Firebase Authentication."
                        };
                        showMessage(messages[error.code] || ("Login gagal: " + (error.message || error.code)));
                    } finally {
                        loginButton.disabled = false;
                        loginButton.textContent = "login";
                    }
                });

                forgotPassword.addEventListener("click", async (event) => {
                    event.preventDefault();
                    const email = emailInput.value.trim();
                    if (!email) {
                        showMessage("Masukkan email terlebih dahulu untuk menerima tautan reset password.");
                        emailInput.focus();
                        return;
                    }
                    try {
                        await sendPasswordResetEmail(auth, email);
                        showMessage("Jika email terdaftar, tautan reset password akan dikirim ke email tersebut.", false);
                    } catch (error) {
                        const messages = {
                            "auth/invalid-email": "Format email tidak valid.",
                            "auth/too-many-requests": "Terlalu banyak permintaan. Coba lagi nanti."
                        };
                        showMessage(messages[error.code] || "Gagal mengirim tautan reset password. Periksa konfigurasi Firebase.");
                    }
                });
            } catch (error) {
                document.body.classList.remove("auth-checking");
                showMessage("Firebase gagal diinisialisasi. Periksa konfigurasi Web App Firebase.", true);
                loginButton.disabled = true;
            }
        }
    </script>

</body>
</html>
