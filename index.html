        .login-card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;

            margin-bottom: 24px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }

        }

        }

        }

            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #007bff;
            outline: none;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <h1>Financial Dashboard</h1>
            <p>Silakan masuk untuk melanjutkan</p>
        </div>
        <!-- Formulir login yang diperbarui dengan atribut id agar dapat diakses melalui JavaScript -->
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="nama@email.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Masuk</button>
        </form>
    </div>

    <script>
        // Skrip untuk menangani fungsi login ketika tombol diklik / form disubmit
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Mencegah perilaku default pengiriman form

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Validasi sederhana (dapat disesuaikan dengan logika autentikasi atau API backend Anda)
            if (email && password) {
                alert('Login berhasil! Selamat datang, ' + email);
                // Contoh pengalihan halaman setelah login berhasil (opsional):
                // window.location.href = 'dashboard.html';
            } else {
                alert('Silakan masukkan email dan password terlebih dahulu.');
            }
        });
    </script>
</body>
