<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Financial Performance Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d1b2a; height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; }
    .login-card { background: #1b263b; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
    .login-card h2 { margin-bottom: 0.5rem; color: #e0e1dd; }
    .login-card p { font-size: 0.9rem; color: #778da9; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: #e0e1dd; }
    .form-group input { width: 100%; padding: 0.75rem; border-radius: 4px; border: 1px solid #415a77; background-color: #0d1b2a; color: #fff; }
    button { width: 100%; padding: 0.75rem; border: none; border-radius: 4px; background-color: #1b4965; color: white; font-weight: bold; cursor: pointer; margin-top: 1rem; }
    button:hover { background-color: #62b6cb; }
    .error-text { color: #ff4d4d; font-size: 0.85rem; margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Admin Login</h2>
    <p>Financial Performance Dashboard</p>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Admin</label>
        <input type="email" id="email" required placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit">Masuk</button>
      <p id="error-message" class="error-text"></p>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Konfigurasi Firebase Kamu
    const firebaseConfig = {
      apiKey: "AIzaSyCR0kDRMDjpKfoQq-DRGM-imiU3DlLmoMI",
      authDomain: "financial-perfomance-dashboard.firebaseapp.com",
      projectId: "financial-perfomance-dashboard",
      storageBucket: "financial-perfomance-dashboard.firebasestorage.app",
      messagingSenderId: "136866453174",
      appId: "1:136866453174:web:b69a3e14672eb96cc53817"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'input.html';
      } catch (error) {
        errorMessage.textContent = 'Login gagal! Periksa email dan password.';
      }
    });
  </script>
</body>
</html>
