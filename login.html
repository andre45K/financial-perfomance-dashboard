<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Financial Performance Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#060d1a;color:#fff;font-family:'Segoe UI',Arial,sans-serif}
    .card{width:100%;max-width:420px;background:#0f1926;border:1px solid #1e2d42;border-radius:14px;padding:28px;box-shadow:0 14px 40px #0008}
    h1{font-size:20px;color:#60a5fa;margin:0 0 8px}p{font-size:13px;color:#94a3b8;line-height:1.6;margin:0 0 22px}
    label{display:block;margin:14px 0 7px;color:#cbd5e1;font-size:13px;font-weight:600}input{width:100%;padding:12px;background:#132238;color:#fff;border:1px solid #2a3d54;border-radius:7px;font-size:14px}
    button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:7px;background:#2563eb;color:white;font-weight:700;font-size:14px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}
    #error{display:none;background:#451a1a;border:1px solid #ef4444;color:#fecaca;border-radius:7px;padding:10px;margin-bottom:12px;font-size:12px;line-height:1.5}
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    const firebaseConfig = {
      apiKey: "AIzaSyCR0kDRMDjpKfoQq-DRGM-imiU3DlLmoMI",
      authDomain: "financial-perfomance-dashboard.firebaseapp.com",
      projectId: "financial-perfomance-dashboard",
      storageBucket: "financial-perfomance-dashboard.firebasestorage.app",
      messagingSenderId: "136866453174",
      appId: "1:136866453174:web:b69a3e14672eb96cc53817"
    };
    const auth = getAuth(initializeApp(firebaseConfig));
    onAuthStateChanged(auth, user => { if (user) window.location.replace("index.html"); });
    document.addEventListener("DOMContentLoaded", () => {
      const form=document.getElementById("loginForm"), btn=document.getElementById("submit"), errorEl=document.getElementById("error");
      form.addEventListener("submit", async e => {
        e.preventDefault(); errorEl.style.display="none"; btn.disabled=true; btn.textContent="Memproses...";
        try { await signInWithEmailAndPassword(auth, document.getElementById("email").value.trim(), document.getElementById("password").value); window.location.replace("index.html"); }
        catch(err) { console.error("Login gagal:",err); errorEl.textContent="Login gagal. Periksa email dan password. Kode: "+(err.code||err.message); errorEl.style.display="block"; }
        finally { btn.disabled=false; btn.textContent="Masuk"; }
      });
    });
  </script>
</head>
<body><main class="card"><h1><i class="fa-solid fa-shield-halved"></i> Login Dashboard Keuangan</h1><p>Masuk menggunakan email dan password yang terdaftar di Firebase Authentication untuk membuka dashboard 2026.</p><div id="error" role="alert"></div><form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Masuk</button></form></main></body>
</html>
